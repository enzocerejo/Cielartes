<!doctype html>
<!-- À quoi sert ce fichier : la seule page du site. Elle pose le cadre (bandeau, zone principale)
     et charge css/style.css (apparence) et js/app.js (qui remplit la page). -->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cielarte</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="band">
    <div class="band-inner">
      <div class="band-left">
        <a href="#accueil" class="brand"><span class="logo" aria-hidden="true"></span>Cielarte</a>
        <div class="hello"><strong id="hello-name">Bonjour</strong><span id="hello-date"></span></div>
      </div>
      <nav class="mainnav" id="mainnav"></nav>
      <div class="palettes" id="palettes" aria-label="Couleur du site"></div>
    </div>
  </header>
  <main id="app"></main>
  <div id="modal" class="modal hidden"><div class="modal-box" id="modal-box"></div></div>
  <div id="confirm" class="modal hidden"></div>
  <div id="toast" class="toast hidden"></div>
  <script src="js/app.js"></script>
</body>
</html>
